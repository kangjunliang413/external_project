[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "my_locolab_project"
version = "0.1.0"
description = "External Go2 locomotion tasks for LocoLab"
requires-python = ">=3.12,<3.13"
dependencies = [
    "isaaclab",
    "isaaclab-tasks",
    "locolab",
    "z-rl",
]

[project.entry-points."locolab.tasks"]
my_locolab_project = "my_locolab_project.tasks"

[tool.setuptools.packages.find]
where = ["."]
include = ["my_locolab_project", "my_locolab_project.*"]
namespaces = false
